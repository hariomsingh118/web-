version: '3.9'

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: booksync_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       booksync
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # auto-runs on first start
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Node.js API ──────────────────────────────────────────────
  api:
    build: .
    container_name: booksync_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT:          5000
      NODE_ENV:      development
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       booksync
      DB_USER:       postgres
      DB_PASSWORD:   postgres
      JWT_SECRET:    super_secret_change_in_prod
      JWT_EXPIRES_IN: 7d
      CLIENT_URL:    http://localhost:3000
    ports:
      - '5000:5000'
    volumes:
      - .:/app
      - /app/node_modules   # anonymous volume so host node_modules don't overwrite
    command: npm run dev

volumes:
  pg_data:
